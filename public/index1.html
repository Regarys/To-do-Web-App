<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>To do Regaryrs</title>
        <link href="./style.css" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    </head>
    <body onload="showingData()">
        <div class="container">
            <h1>Regarys To-do</h1>
            <div class="content">
                <h3 id="date"></h3>
                <div id="data" class="list-container"></div>
            </div>
            <button id="addData">Tambahkan Data</button>
            <div id="modal" class="modal">
               <div class="modal-content">
                   <h2>Add To-Do</h2>
                   <input type="text" id="title" placeholder="Masukan To-do..">
                   <div class="modal-buttons">
                       <button id="save">Save</button>
                       <button id="closeModal">Cancel</button>
                   </div>
               </div>
            </div>
            <div class="modalEdit" id="modalEdit">
               <div class="edit-content">
                   <h2>Edit To-Do</h2>
                   <input id="editTitle" type="text"> 
                   <div class="modal-buttons">
                       <button id="edit">edit</button>
                       <button id="closeModalEdit">Cancel</button>
                   </div>
               </div>
           </div>
        </div>
        <script src="./app.js">
        </script>
    </body>
</html>
