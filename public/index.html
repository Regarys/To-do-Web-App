<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>To do Regaryrs</title>
        <link href="./style.css" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    </head>
    <body>
       <div class="year-nav">
           <button class="year-btn" id="year-prev">&#9664;</button>
           <h1 id="year">2026</h1>
           <button class="year-btn" id="year-next">&#9654;</button>
       </div>
       <div class="quick-nav">
           <a class="quick-btn" id="btn-yesterday">Yesterday</a>
           <a class="quick-btn" id="btn-today">Today</a>
           <a class="quick-btn" id="btn-tomorrow">Tomorrow</a>
       </div>
       <div class="month-container" id="data-calendar">
        
       </div>
       <div class="panel" id="panel">
           <div class="panel-content" id="panel-content">
           </div>
     </div>

       <script src="calendar.js"></script>
    </body>
</html>
